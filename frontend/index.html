<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PUBGM Inventory</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white font-sans">

    <div class="max-w-4xl mx-auto p-6">

        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 id="judul" class="text-3xl font-bold tracking-wide">Loading...</h1>
            <p id="owner" class="text-gray-400 mt-2 text-sm"></p>
        </div>

        <!-- Add Item -->
        <div class="flex flex-col gap-3 mb-6">
            <div class="flex flex-col md:flex-row gap-3">
                <input id="item-nama" type="text" placeholder="Nama (contoh: AKM)"
                    class="flex-1 px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-white">
                <input id="item-tipe" type="text" placeholder="Tipe (contoh: Assault Rifle)"
                    class="flex-1 px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-white">
                <input id="item-detail" type="text" placeholder="Info Lain (contoh: 7.62mm)"
                    class="flex-1 px-4 py-2 bg-zinc-900 border border-zinc-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-white">
            </div>
            <button onclick="tambahItem()"
                class="w-full px-5 py-2 bg-white text-black rounded-lg font-semibold hover:bg-gray-200 transition">
                Tambah
            </button>
        </div>

        <!-- Item List -->
        <div id="item-list" class="space-y-3"></div>

    </div>

    <script>
        const API_URL = '/api';

        function loadData() {
            fetch(`${API_URL}/info`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('judul').innerText = data.judul_katalog;
                    document.getElementById('owner').innerText =
                        `Owner: ${data.pemilik} | NIM: ${data.nim}`;

                    const list = document.getElementById('item-list');
                    list.innerHTML = '';

                    data.items.forEach(item => {
                        let div = document.createElement('div');

                        div.className = "bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 flex justify-between items-center hover:border-white transition";

                        if (typeof item === "object") {
                            div.innerHTML = `
                                <div>
                                    <p class="font-semibold">${item.nama}</p>
                                    <p class="text-sm text-gray-400">${item.tipe}</p>
                                </div>
                                <span class="text-xs text-gray-500">
                                    ${item.ammo || item.durability || ''}
                                </span>
                            `;
                        } else {
                            div.innerText = item;
                        }

                        list.appendChild(div);
                    });
                });
        }

        function tambahItem() {
            const inputNama = document.getElementById('item-nama');
            const inputTipe = document.getElementById('item-tipe');
            const inputDetail = document.getElementById('item-detail');

            if (!inputNama.value || !inputTipe.value) {
                alert('Nama dan Tipe harus diisi!');
                return;
            }

            const newItemObj = {
                nama: inputNama.value,
                tipe: inputTipe.value,
                ammo: inputDetail.value
            };

            fetch(`${API_URL}/add-item`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ item: newItemObj })
            })
                .then(res => res.json())
                .then(() => {
                    inputNama.value = '';
                    inputTipe.value = '';
                    inputDetail.value = '';
                    loadData();
                });
        }

        loadData();
    </script>

</body>

</html>
